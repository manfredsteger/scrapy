# MapScraper Pro - Docker Compose
# Works on: x86_64 (amd64), ARM64 (Apple Silicon, Raspberry Pi 4+), ARMv7
# 
# Usage:
#   Development: docker compose up
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# All data is stored locally - no external database connections required.

services:
  # PostgreSQL Database - Local Only
  db:
    image: postgres:16-alpine
    container_name: mapscraper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mapscraper
      POSTGRES_PASSWORD: mapscraper_secret
      POSTGRES_DB: mapscraper
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"  # Externer Port 5433 um Konflikte mit lokaler PostgreSQL zu vermeiden
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapscraper -d mapscraper"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mapscraper-network

  # MapScraper Pro Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: mapscraper-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://mapscraper:mapscraper_secret@db:5432/mapscraper
      SESSION_SECRET: local-dev-session-secret-change-in-production
      PORT: 5000
      # Optional: enables AI features (keyword/entity extraction, embeddings,
      # metadata enrichment). The app runs fine without it - those features
      # are just skipped. Set it in your shell or a .env file next to this
      # file (docker compose reads .env automatically) before `make dev`.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Dev-only source bind mount lives in docker-compose.override.yml, which
    # `docker compose up` merges in automatically but an explicit `-f`
    # invocation (as docker-compose.prod.yml uses) does not. Compose merges
    # `volumes:` lists across -f files rather than letting a later file
    # clear them, so this split - not an empty `volumes: []` in the prod
    # override - is what actually keeps the host source tree out of the
    # production image.
    ports:
      - "3333:5000"  # Externer Port 3333 um Konflikte zu vermeiden
    networks:
      - mapscraper-network

volumes:
  postgres_data:
    driver: local

networks:
  mapscraper-network:
    driver: bridge
